[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "engineer-hq"
version = "0.0.1"
description = "Harness de engenharia de código: orquestra EARS→BDD→TDD com gates mensuráveis, governados por estado por-projeto indexado no workspace do engenheiro."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexandre" }]
keywords = ["tdd", "bdd", "ears", "lint", "metrics", "harness", "opencode"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ehq = "engineer_hq.cli:app"

[project.urls]
Homepage = "https://github.com/JimSP/harness-opencode"
Repository = "https://github.com/JimSP/harness-opencode"

[tool.hatch.build.targets.wheel]
packages = ["src/engineer_hq"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "ROADMAP.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
